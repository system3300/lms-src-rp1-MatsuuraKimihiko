<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">

<title>勤怠情報変更｜LMS</title>
</head>
<body>
	<style>
	.form-control.is-invalid {
		    border-color: #d9534f !important;
		    background-color: #f2dede !important;
		}
	</style>
	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12" style="	height: 560px;overflow-y: auto">

			<form th:action="@{/attendance/update}"
			      method="post"
			      th:object="${attendanceForm}">
				  <div th:if="${#fields.hasErrors('*')}">
				      <ul style="margin-bottom:0;color:#d9534f;">
				          <li th:each="err : ${#fields.errors('*')}"
				              th:text="${err}">
				          </li>
				      </ul>
				  </div>
				  <table class="table table-hover dataTable no-footer">
					<!--Task.26 -松浦公彦- -->
					<thead>
						<!--松浦公彦 -Task.29- -->
						<tr style="position: sticky;top: 0;background: #fff;z-index: 10">
							<th class="w140">日付</th>
							<th class="w300" colspan="2">コース内容</th>
							<th class="w70" colspan="3">出勤</th>
							<th class="w70" colspan="3">退勤</th>
							<th class="w140">中抜け時間</th>
							<th class="w140">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					
					<tbody style="">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								<td>								
							    <!--松浦公彦 -Task.28- -->
						        <button class="btn btn-success default-button">定時</button>
					            </td>
								<!--松浦公彦 -Task.26- -->
								<td class="w70">
									<select
									    th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
									    class="form-control"
									    th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')} ? ' is-invalid'">
								<option th:each="trainingStartTimeHour : ${attendanceForm.hourMap}" th:value="${trainingStartTimeHour.key}" th:inline="text" class="form-control" 
							    th:selected="${trainingStartTimeHour.key == dailyAttendanceForm.trainingStartTimeHour}">[[${trainingStartTimeHour.value}]]</option>
							    </select>
								</td>
								<td>:</td>
								<td class="w70">
									<select
									    th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
									    class="form-control"
									    th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMinute')} ? ' is-invalid'">							    
										<option th:each="trainingStartTimeMinute : ${attendanceForm.minuteMap}" th:value="${trainingStartTimeMinute.key}" th:inline="text" class="form-control" 
							    th:selected="${trainingStartTimeMinute.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${trainingStartTimeMinute.value}]]</option>
						        </select>
							    </td>
								
								<td class="w70">
									<select
									    th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
									    class="form-control"
									    th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')} ? ' is-invalid'">								
										<option th:each="trainingEndTimeHour : ${attendanceForm.hourMap}" th:value="${trainingEndTimeHour.key}" th:inline="text" class="form-control" 
							    th:selected="${trainingEndTimeHour.key == dailyAttendanceForm.trainingEndTimeHour}">[[${trainingEndTimeHour.value}]]</option>
							    </select>
								</td>
								<td>:</td>
								<td class="w70">
									<select
									    th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
									    class="form-control"
									    th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMinute')} ? ' is-invalid'">								
										<option th:each="trainingEndTimeMinute : ${attendanceForm.minuteMap}" th:value="${trainingEndTimeMinute.key}" th:inline="text" class="form-control" 
								th:selected="${trainingEndTimeMinute.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${trainingEndTimeMinute.value}]]</option>
							    </select>
								</td>
								<!--	<td class="w70">
									<input type="text" th:name="|attendanceList[${stat.index}].trainingStartTime|"
									th:value="${dailyAttendanceForm.trainingStartTime}" class="form-control" />
								</td> -->
					
								<!--
								<td class="w70">
									<input type="text" th:name="|attendanceList[${stat.index}].trainingEndTime|"
									th:value="${dailyAttendanceForm.trainingEndTime}" class="form-control" />
								</td> -->
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
									th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? ' is-invalid'">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inline="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"
									th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? ' is-invalid'"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" id="mybtn"/>
				</div>

			</form>
		</div>
	</div>
	<!--松浦公彦 -Task.28- -->
	<script>
	document.querySelectorAll(".default-button").forEach(button => {

	    button.addEventListener("click", function(event) {
	        event.preventDefault();

	        const row = this.closest("tr");

	        
	        row.querySelector('[name$=".trainingStartTimeHour"]').value = "9";
	        row.querySelector('[name$=".trainingStartTimeMinute"]').value = "0";

	        row.querySelector('[name$=".trainingEndTimeHour"]').value = "18";
	        row.querySelector('[name$=".trainingEndTimeMinute"]').value = "0";
           });

	});

	</script>
	<script>
		document.getElementById('mybtn').addEventListener('click', function(event) {
		    if (!confirm('更新します。よろしいですか？')) {
		        event.preventDefault();
		    }
		});
	</script>

</body>
</html>
